name: Build Cloudflare container image

# Builds the image the tpc-umami-cloudflare Worker runs and pushes it to Cloudflare's registry.
# Push-triggered on the deploy branch only; no pull_request trigger, so forks never see the token.
on:
  push:
    branches:
      - tpc-auth

concurrency:
  group: cloudflare-image
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          TAG="tpc-umami-cloudflare-umamicontainer:${GITHUB_REF_NAME}-${GITHUB_SHA::8}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 -t "$TAG" .

      # Boot the image with the Worker's env shape (no real DB) and fail before pushing if it
      # doesn't come up. A broken image here took analytics down on 2026-09-25.
      - name: Boot check
        run: |
          docker run -d --name boot -p 3000:3000 \
            -e DATABASE_URL=postgresql://u:p@127.0.0.1:5432/x -e SKIP_DB_CHECK=1 -e APP_SECRET=ci -e FORCE_SSL=1 -e DISABLE_TELEMETRY=1 -e PORT=3000 \
            -e DISABLE_LOGIN=1 -e TPC_AUTH_ENABLED=1 -e NEXT_PUBLIC_TPC_AUTH_ENABLED=1 \
            -e TPC_AUTH_ISSUER=https://auth.theportlandcompany.com -e TPC_CLIENT_ID=tpc-analytics-umami \
            -e TPC_RESOURCE=https://analytics.theportlandcompany.com "$TAG"
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/api/heartbeat && ok=1 && break
            sleep 3
          done
          docker logs boot 2>&1 | tail -60
          [ "${ok:-}" = 1 ]

      - name: Push to Cloudflare registry
        run: npx -y wrangler@4 containers push "$TAG"

      - name: Image reference
        run: echo "registry.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/${TAG}" >> "$GITHUB_STEP_SUMMARY"
